apiVersion: v1
kind: Pod
spec:
  containers:
    - name: agent
      image: us-west1-docker.pkg.dev/dremio-1093/jenkins/jenkins-hadoop-slave:v9
      command:
        - tail
        - -f
      resources:
        requests:
          cpu: 2000m
          memory: 8G
        limits:
          cpu: 4000m
          memory: 8G
      volumeMounts:
        - name: workspace-volume
          mountPath: /home/jenkins/agent
      workingDir: /home/jenkins/agent
  nodeSelector:
    kubernetes.io/arch: amd64
    kubernetes.io/os: linux
  restartPolicy: Never
  serviceAccountName: default
  volumes:
    - name: workspace-volume
      emptyDir: {}
