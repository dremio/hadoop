apiVersion: v1
kind: Pod
spec:
  securityContext:
    fsGroup: 1000
  containers:
    - name: agent
      image: us-west1-docker.pkg.dev/dremio-1093/jenkins/jenkins-agent:v44
      command: [cat]
      tty: true
      workingDir: /jenkins
      env:
        - name: DOCKER_HOST
          value: tcp://localhost:2376
        - name: DOCKER_TLS_VERIFY
          value: "1"
        - name: DOCKER_CERT_PATH
          value: /certs/client
      resources:
        requests:
          cpu: "4"
          memory: 8Gi
          ephemeral-storage: 8Gi
        limits:
          cpu: "8"
          memory: 12Gi
          ephemeral-storage: 20Gi
      volumeMounts:
        - name: docker-certs
          mountPath: /certs
        - name: workspace-volume
          mountPath: /jenkins
    - name: dind
      image: mirror.gcr.io/docker:28-dind
      args:
        - --registry-mirror
        - https://mirror.gcr.io
      securityContext:
        privileged: true
      resources:
        requests:
          cpu: "8"
          memory: 24Gi
          ephemeral-storage: 2Gi
        limits:
          cpu: "12"
          memory: 32Gi
          ephemeral-storage: 10Gi
      volumeMounts:
        - name: docker-certs
          mountPath: /certs
        - name: docker-data
          mountPath: /var/lib/docker
        - name: workspace-volume
          mountPath: /jenkins
  nodeSelector:
    kubernetes.io/arch: amd64
    kubernetes.io/os: linux
    spot: "false"
  restartPolicy: Never
  serviceAccountName: default
  volumes:
    - name: docker-certs
      emptyDir: {}
    - name: docker-data
      ephemeral:
        volumeClaimTemplate:
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 80Gi
    - name: workspace-volume
      emptyDir: {}
